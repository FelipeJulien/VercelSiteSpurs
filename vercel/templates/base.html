{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Site oficial não-oficial dos San Antonio Spurs --times de basquete da NBA">
    <title>{% block title %}San Antonio Spurs{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        outfit: ['Outfit', 'sans-serif'],
                        barlow: ['"Barlow Condensed"', 'sans-serif'],
                    },
                    colors: {
                        spurs: {
                            silver: '#B6B6B4',
                            black: '#000000',
                            navy: '#06143B',
                            gray: '#63717A',
                        },
                        fiesta: {
                            turquoise: '#00B2A9',
                            pink: '#EF426F',
                            orange: '#FF8200',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@600;700;800;900&family=Barlow+Condensed:ital,wght@1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col">
    
    {% include 'components/header.html' %}
    
    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>
    
    {% include 'components/footer.html' %}
    
</body>
</html>
