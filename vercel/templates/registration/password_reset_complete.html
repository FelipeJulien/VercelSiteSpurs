{% extends 'base.html' %}

{% block title %}Senha Redefinida — San Antonio Spurs{% endblock %}

{% block content %}
<section class="min-h-[80vh] flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md text-center">
        <div class="bg-gray-800 border border-gray-700 rounded-2xl shadow-2xl overflow-hidden">
            <div class="bg-black px-8 py-6 border-b-4 border-spurs-silver">
                <h1 class="text-2xl font-bold text-white tracking-wider">SENHA REDEFINIDA!</h1>
            </div>
            <div class="px-8 py-10">
                <div class="flex items-center justify-center w-16 h-16 bg-green-900/40 border border-green-600 rounded-full mx-auto mb-6">
                    <i class="fas fa-shield-alt text-green-400 text-3xl"></i>
                </div>
                <p class="text-gray-300 text-lg mb-2">Sua senha foi redefinida com sucesso!</p>
                <p class="text-gray-500 text-sm mb-8">Agora você pode fazer login com a nova senha.</p>
                <a href="{% url 'login' %}"
                   id="btn-go-login"
                   class="inline-block bg-spurs-silver text-black font-bold px-8 py-3 rounded-lg hover:bg-white transition-colors">
                    <i class="fas fa-sign-in-alt mr-2"></i>Fazer Login
                </a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
